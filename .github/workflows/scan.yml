name: PRO4 scanner

on:
  schedule:
    # Every 2-3 min right after each hourly close, then every 15 min to follow open trades.
    # Mon-Fri 11:00-21:59 UTC = covers 07:00-16:00 New York in summer and winter time.
    - cron: "1,3,5,7,18,33,48 11-21 * * 1-5"
    # Once an hour the rest of the week, only does work when a paper trade is still open
    - cron: "8 0-10,22-23 * * 0-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "numpy>=1.26"
      - name: Scan
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python scanner/scan.py
      - name: Save results
        run: |
          git config user.name "pro4-scanner"
          git config user.email "pro4-scanner@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --quiet || true
            git push
          fi
